name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Playwright/chromium is required by rehype-mermaid (inline-svg strategy)
      # to render ```mermaid code blocks into inline SVG at build time.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Type check
        run: npm run check
      - name: Factual linter (forbidden claims)
        run: npm run lint:facts
      - name: Astro build
        run: npm run build
      - name: Internal link check
        run: npm run lint:links
      - name: Upload dist artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 7
