name: Auto-merge auto-merge-ok PRs

# Watches PRs that carry the `auto-merge-ok` label (applied by
# brain4machinery-engine's PR Builder when Editor returns a clean PASS on
# a low-risk collection — currently glossary only). On a qualifying PR,
# enables GitHub's native auto-merge with --squash, which:
#   - waits for required checks (build / lint:facts / lint:links / check) to pass,
#   - then squash-merges + deletes the branch.
# If checks have already passed by the time we get here, merge fires immediately.
# If the PR is later disqualified (someone strips the label, a new commit
# breaks CI), GitHub cancels the pending merge automatically.

on:
  pull_request_target:
    types: [labeled, opened, reopened, synchronize]
    branches: [main]

jobs:
  auto-merge:
    # Both conditions must hold:
    # 1. Label is present (engine's PR Builder applies it).
    # 2. The PR is not a draft — drafts opt out of auto-merge by design.
    if: |
      contains(github.event.pull_request.labels.*.name, 'auto-merge-ok')
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Enable native auto-merge (squash)
        env:
          # GITHUB_TOKEN under pull_request_target has elevated permissions
          # so it can call the merge API. We rely on branch protections + the
          # `auto-merge-ok` label being applied only by the trusted engine
          # bot as the security model.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Graceful exit: GitHub's `gh pr merge --auto` returns an error when
        # the repository-level "Allow auto-merge" setting is disabled. In that
        # case the workflow still surfaces a green run + leaves the
        # auto-merge-ok label on the PR so a human can spot it and merge
        # manually. The label is the audit trail; the workflow is just trying
        # to make it cheaper.
        run: |
          PR=${{ github.event.pull_request.number }}
          echo "Attempting to enable auto-merge on PR #$PR"
          if ! gh pr merge "$PR" \
              --repo ${{ github.repository }} \
              --auto --squash --delete-branch 2>&1 | tee /tmp/automerge.log; then
            if grep -q -i "auto.merge is not allowed\|auto merge is not\|enable auto.merge" /tmp/automerge.log; then
              echo ""
              echo "::notice title=Auto-merge unavailable::"\
                   "Repository-level 'Allow auto-merge' is disabled (see"\
                   " Settings -> General -> Pull Requests). The PR still has"\
                   " the auto-merge-ok label; merge manually when ready."
              exit 0
            fi
            echo "::warning title=Auto-merge attempt failed::See log above."
            exit 0
          fi
          echo "Auto-merge enabled. GitHub will merge after required checks pass."
