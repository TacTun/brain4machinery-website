name: Regenerate llms.txt

on:
  schedule:
    - cron: '17 5 * * *'   # nightly at 05:17 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [content-changed]

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Regenerate llms.txt and llms-full.txt
        run: node scripts/generate-llms-txt.mjs
      - name: Open PR if changed
        # SHA-pinned to v8.1.1 (Node 24 line — GitHub force-runs actions on
        # Node 24 from 2026-06-16; v7 is Node 20). NOTE: PRs created with the
        # default GITHUB_TOKEN do not trigger CI/agent-review, so a rolling
        # regen PR with a REAL content diff needs a human (or PAT) to get
        # checks run before it can merge past branch protection.
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          commit-message: 'chore(llms): nightly regenerate llms.txt + llms-full.txt'
          title: 'chore(llms): nightly regenerate'
          body: |
            Automated nightly regeneration of `public/llms.txt` and `public/llms-full.txt`
            based on current content collections.

            Safe to auto-merge: only touches the two LLM-citation index files.
          branch: chore/llms-regen
          delete-branch: true
          labels: |
            auto-merge-ok
            llms
