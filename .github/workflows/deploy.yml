name: Deploy to Cloudflare Pages

# Triggers
# - push to main          → production deploy (--branch=main on CF Pages).
#                            PRODUCTION VALIDATES BEFORE PUBLISH (see gate below).
# - workflow_dispatch     → manual / programmatic production deploy. Used by
#                            deploy-on-merge.yml to deploy after a bot/auto-merge,
#                            because a GITHUB_TOKEN merge push does NOT trigger
#                            the `push:` event (GitHub loop-prevention).
# - push to article/**    → preview deploy on the branch name. Cloudflare
#                            Pages exposes each non-production branch at
#                            <branch>.brain4machinery-website.pages.dev,
#                            giving the content pipeline (and any human
#                            reviewer / CTO) a self-contained, forwardable
#                            URL to read the article in its real layout
#                            BEFORE it merges to main.
# - pull_request          → same preview-branch deploy for any PR, so
#                            reviewers can open the article rendered
#                            without checking out the branch locally.
#
# Note: When a PR is opened from an `article/**` branch, BOTH the push AND
# the pull_request triggers fire. The `concurrency:` block below serializes
# them so two CF Pages deploys don't race for the same branch slot.
on:
  push:
    branches:
      - main
      - 'article/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

# One deploy per branch at a time. Push + PR from the same branch are
# serialized (no race for the CF Pages slot). Newer push wins; pending push
# is cancelled. Cancel-in-progress=true is safe: each deploy step is
# idempotent and CF Pages handles partial uploads by retrying the next run.
concurrency:
  group: deploy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip PRs from forks entirely — Cloudflare secrets MUST NOT be exposed
    # to a fork's modified workflow. Same-repo PRs are fine because the
    # branch is owned by us. The repo has no external contributors today,
    # but defense-in-depth: never trust a fork to deploy with our token.
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
      pull-requests: write  # to comment the preview URL back on the PR
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Playwright/chromium is required by rehype-mermaid (inline-svg strategy)
      # to render ```mermaid code blocks into inline SVG at build time.
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # Build produces the dist artifact required for both publish and the
      # link checker (which scans built HTML).
      - run: npm run build

      # Resolve whether this run is a PRODUCTION deploy:
      #   push to main, or workflow_dispatch on main.
      # Preview deploys (PRs, article/** pushes) are NOT production.
      - name: Resolve deploy mode
        id: mode
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && \
             { [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; }; then
            echo "prod=true" >> "$GITHUB_OUTPUT"
          else
            echo "prod=false" >> "$GITHUB_OUTPUT"
          fi

      # Resolve the branch name for Cloudflare Pages:
      # - on push          → github.ref_name (e.g. "main" or "article/foo")
      # - on pull_request  → github.head_ref (the PR's source branch)
      # CF Pages treats anything ≠ main as a preview deployment with its own
      # subdomain. We sanitize "/" → "-" for the URL slug (CF Pages does
      # this internally for the preview-subdomain hostname). NOTE: CF Pages
      # also truncates branch names beyond ~28 chars for the subdomain, so
      # very long article slugs may not produce the exact URL constructed
      # in the sticky comment below — keep slugs short.
      - name: Resolve CF Pages branch
        id: cfbranch
        run: |
          RAW="${{ github.head_ref || github.ref_name }}"
          SLUG="${RAW//\//-}"
          echo "raw=$RAW"   >> $GITHUB_OUTPUT
          echo "slug=$SLUG" >> $GITHUB_OUTPUT

      # PRODUCTION GATE — validate BEFORE publishing to production.
      # On main (push or dispatch) a lint failure must stop the deploy so we
      # never publish broken facts/links to the live site. This is the fix for
      # the previous ordering, where production published before validation ran.
      - name: Production gate — lint before publish
        if: steps.mode.outputs.prod == 'true'
        run: |
          npm run lint:facts
          npm run lint:links

      # PUBLISH.
      # For PREVIEWS we publish BEFORE lint (see preview lint below): the whole
      # point of a preview is to let a reviewer see the rendered article in its
      # real layout — including when lint failed, so they can inspect the
      # broken link/fact in context. For PRODUCTION the gate above already ran.
      - name: Publish to Cloudflare Pages
        id: publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=brain4machinery-website --branch=${{ steps.cfbranch.outputs.raw }}

      # On PRs, post the preview URL as a comment so the reviewer (and any
      # forwarded CTO) gets a clickable, self-contained link in their inbox
      # without having to dig through CF Pages dashboards. Posted BEFORE
      # the preview lint so the URL is available even on a lint failure.
      #
      # SHA-pinned to v3.0.4 (released 2026-04-10; v3.0.0 moved the action to
      # Node 24 ahead of GitHub's 2026-06-16 forced-node24 cutoff) so a
      # tag-rewrite attack on the action can't escalate against our
      # pull-requests:write + CLOUDFLARE_API_TOKEN. Bump the pin manually
      # when reviewing a new release in the
      # marocchino/sticky-pull-request-comment repo.
      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.cfbranch.outputs.slug != 'main'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0  # v3.0.4
        with:
          header: cf-preview
          message: |
            ### 🌐 Cloudflare Pages preview
            **Preview URL:** https://${{ steps.cfbranch.outputs.slug }}.brain4machinery-website.pages.dev

            This URL renders the site exactly as it will look on production. Forward this email/URL
            to anyone who needs to review — no GitHub account required.

            _If lint failed for this PR, the preview is still live above — open it to inspect the failing link/fact in context._

      # PREVIEW LINT — after publish, previews only. A lint failure still fails
      # the workflow run (the CI workflow's required `build` check also lints,
      # and blocks merge via branch protection), but the preview URL is already
      # posted above for the reviewer.
      - name: Lint (preview, post-publish)
        if: steps.mode.outputs.prod != 'true'
        run: |
          npm run lint:facts
          npm run lint:links

      # Only fire the engine-deploy notifier for ACTUAL production deploys
      # (push to main or workflow_dispatch on main, NOT PRs or article-branch
      # pushes). Preview deploys should not log themselves as a real
      # publication in the engine's state/analytics/deploys.log.
      - name: Notify engine of deploy
        if: success() && steps.mode.outputs.prod == 'true' && env.ENGINE_DISPATCH_TOKEN != ''
        env:
          ENGINE_DISPATCH_TOKEN: ${{ secrets.ENGINE_DISPATCH_TOKEN }}
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.ENGINE_DISPATCH_TOKEN }}
          repository: ${{ vars.ENGINE_REPO }}
          event-type: website-deployed
          client-payload: '{"sha": "${{ github.sha }}", "ref": "${{ github.ref }}"}'
